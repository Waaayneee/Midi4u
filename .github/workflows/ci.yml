name: CI

on:
  push:
  pull_request:

permissions:
  contents: write # lets a v* tag publish a GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build plugin, app and tests
        run: cmake --build build --config Release --parallel

      - name: Unit and integration tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "build/plugin/Midi4uTap_artefacts/Release/VST3/Midi4u Tap.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/app/Midi4u_artefacts/Release/Midi4u.exe package/
          Copy-Item -Recurse "build/plugin/Midi4uTap_artefacts/Release/VST3/Midi4u Tap.vst3" package/
          Copy-Item updater/* package/

      # Download from the run's Summary page: a zip with Midi4u.exe, the Midi4u Tap.vst3 folder and the updater.
      - uses: actions/upload-artifact@v4
        with:
          name: Midi4u-windows
          path: package/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs/
          if-no-files-found: ignore

      # Push a tag like v0.2.0 to publish a release. The updater installs the newest one.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive package/* Midi4u-windows.zip
          gh release create $env:GITHUB_REF_NAME Midi4u-windows.zip --title "Midi4u $env:GITHUB_REF_NAME" --generate-notes
